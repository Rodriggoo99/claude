<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;font-weight:500;src:url(node_modules/@fontsource/inter/files/inter-latin-500-normal.woff2)}
@font-face{font-family:Inter;font-weight:600;src:url(node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2)}
@font-face{font-family:Inter;font-weight:800;src:url(node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2)}
@font-face{font-family:Serif;font-style:italic;src:url(node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2)}
@font-face{font-family:Serif;font-style:normal;src:url(node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-normal.woff2)}
:root{--ink:#fff;--cream:#F4ECE1;--navy0:#080B12;--navy1:#131C2C;--pill:#E4EAF4;--line:rgba(255,255,255,.2)}
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
*{box-sizing:border-box}
#cap{position:absolute;left:60px;right:60px;top:0;height:1920px;pointer-events:none}
.chunk{position:absolute;left:0;right:0;top:470px;transform:translateY(-50%);text-align:center;
  font-family:Inter;font-weight:700;font-size:56px;line-height:1.12;letter-spacing:-.022em;color:var(--ink);
  text-shadow:0 2px 18px rgba(0,0,0,.30),0 1px 3px rgba(0,0,0,.28)}
.line{display:block;white-space:nowrap}
.w{display:inline-block;will-change:transform}
.acc{font-family:Serif;font-style:italic;font-weight:400;font-size:1.28em;letter-spacing:-.01em;color:var(--cream);line-height:.9}
.hero{font-family:Serif;font-style:italic;font-weight:400;font-size:190px;line-height:.95;letter-spacing:-.02em;color:var(--cream)}
.small{font-size:46px;font-weight:600;letter-spacing:-.01em}
body.caps .chunk{text-transform:uppercase;font-weight:800;font-size:46px;letter-spacing:.012em;line-height:1.2}
body.caps .acc{font-size:1.22em;letter-spacing:.02em;line-height:.9}
body.caps .small{font-size:38px;font-weight:700;letter-spacing:.05em}
body.caps .hero{letter-spacing:0}
body.caps .capsable{text-transform:uppercase;letter-spacing:.01em}
body.caps #g3t{font-size:66px}
body.caps .box{font-size:44px}
/* graphics */
.g{position:absolute;inset:0;opacity:0}
.bg{position:absolute;inset:0;background:linear-gradient(180deg,var(--navy0) 0%,#0E1522 30%,var(--navy1) 52%,#0D1320 72%,var(--navy0) 100%)}
.kicker{font-family:Inter;font-weight:600;font-size:25px;letter-spacing:.42em;color:rgba(255,255,255,.5);text-transform:uppercase}
.card{position:absolute;left:130px;width:820px;height:108px;border:2px solid rgba(255,255,255,.22);border-radius:22px;
  background:rgba(255,255,255,.035);display:flex;align-items:center;padding:0 34px;gap:26px}
.card .t{font-family:Inter;font-weight:600;font-size:40px;color:#fff;letter-spacing:-.01em;flex:1}
.card .s{font-family:Inter;font-weight:600;font-size:24px;letter-spacing:.32em;color:rgba(255,255,255,.55)}
.ico{width:44px;height:44px;flex:none}
.bar{position:absolute;left:130px;width:820px;height:8px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:8px}
.lbl{position:absolute;font-family:Inter;font-weight:600;font-size:24px;letter-spacing:.38em;color:rgba(255,255,255,.55)}
.pill{position:absolute;background:var(--pill);color:#0B0F17;font-family:Inter;font-weight:800;font-size:58px;border-radius:20px;
  padding:14px 44px;letter-spacing:-.02em}
.box{position:absolute;border:2px solid rgba(255,255,255,.35);border-radius:22px;padding:22px 40px;font-family:Inter;font-weight:600;
  font-size:52px;color:#fff;letter-spacing:-.015em;white-space:nowrap}
.box .acc{font-size:1.3em}
.tag{position:absolute;background:var(--pill);color:#0B0F17;font-family:Inter;font-weight:800;font-size:22px;letter-spacing:.3em;
  border-radius:40px;padding:10px 20px 10px 26px}
.node{position:absolute;width:30px;height:30px;border-radius:50%;background:var(--pill);box-shadow:0 0 0 8px rgba(228,234,244,.12)}
.vline{position:absolute;width:3px;background:rgba(255,255,255,.55);border-radius:3px}
.sr{font-family:Serif;font-style:italic;color:var(--cream)}
</style></head>
<body>
<div id="g1" class="g"><div class="bg"></div>
  <div class="kicker" style="position:absolute;top:590px;width:100%;text-align:center" id="g1k">mais de 1 mês</div>
  <div id="g1cards"></div>
  <div class="bar" id="g1bar" style="top:1300px"><i></i></div>
  <div class="lbl" id="g1bl" style="top:1334px;width:100%;left:0;text-align:center">PROJETO</div>
</div>
<div id="g2" class="g"><div class="bg"></div>
  <div id="g2h" style="position:absolute;left:130px;top:640px;display:flex;align-items:center;gap:30px">
    <svg class="ico" style="width:78px;height:78px" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18"/></svg>
    <span class="sr" style="font-size:132px;line-height:1">mesmo dia</span>
  </div>
  <div class="vline" id="g2line" style="left:163px;top:800px;height:0"></div>
  <div class="node" id="g2n1" style="left:150px;top:955px"></div>
  <div class="lbl" id="g2l1" style="left:228px;top:878px">A RESPOSTA</div>
  <div class="pill capsable" id="g2p" style="left:228px;top:925px">não.</div>
  <div class="node" id="g2n2" style="left:150px;top:1205px"></div>
  <div class="lbl" id="g2l2" style="left:228px;top:1128px">ESTAVAM A LANÇAR</div>
  <div class="box capsable" id="g2b" style="left:228px;top:1172px"><span id="g2b1">uma das </span><span id="g2b2" class="acc">ideias</span></div>
  <div class="tag" id="g2tag" style="left:640px;top:1290px">NOSSAS</div>
</div>
<div id="g3" class="g"><div class="bg"></div>
  <div class="kicker" id="g3k" style="position:absolute;top:470px;width:100%;text-align:center">a nossa regra</div>
  <svg id="g3doc" style="position:absolute;left:465px;top:545px;width:150px;height:190px" viewBox="0 0 150 190" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round">
    <rect x="4" y="4" width="142" height="182" rx="16"/>
    <path d="M32 44h86M32 70h86M32 96h86" stroke-opacity=".45"/>
    <path id="g3sig" d="M30 150 C40 118,55 118,62 140 S82 165,92 140 S112 118,122 136"/>
  </svg>
  <div id="g3t" class="capsable" style="position:absolute;top:780px;width:100%;text-align:center;font-family:Inter;font-weight:800;font-size:76px;color:#fff;letter-spacing:-.03em">
    <span class="w">antes</span> <span class="w">de</span> <span class="w">assinar</span></div>
  <div id="g3r1" style="position:absolute;left:170px;top:980px;display:flex;align-items:center;gap:34px">
    <svg width="92" height="92" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="#E4EAF4"/><path d="M7 12.5l3.2 3.2L17 9" stroke="#0B0F17" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div><div class="lbl" style="position:static">FAZEMOS O</div><div class="sr" id="g3d" style="font-size:118px;line-height:1">diagnóstico</div></div>
  </div>
  <div id="g3r2" style="position:absolute;left:170px;top:1210px;display:flex;align-items:center;gap:34px">
    <svg width="92" height="92" viewBox="0 0 24 24"><circle cx="12" cy="12" r="12" fill="rgba(255,255,255,.16)"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>
    <div style="position:relative"><div class="lbl" style="position:static">NÃO APRESENTAMOS A</div>
      <div class="sr" id="g3s" style="font-size:118px;line-height:1;color:rgba(244,236,225,.6);position:relative;display:inline-block">solução
        <i id="g3strike" style="position:absolute;left:-6px;top:58%;height:5px;background:#F4ECE1;border-radius:4px;width:0"></i></div></div>
  </div>
</div>
<div id="cap"></div>
<script>
const clamp=(x)=>Math.max(0,Math.min(1,x));
const eo=(x)=>{x=clamp(x);return 1-Math.pow(1-x,3)};          // ease-out cubic
const eio=(x)=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const p=(t,t0,d)=>eo((t-t0)/d);
const $=(id)=>document.getElementById(id);
let CAPS=[];
function reveal(el,k,dy=16,blur=8){el.style.opacity=k;el.style.transform=`translateY(${(1-k)*dy}px)`;el.style.filter=k<1?`blur(${(1-k)*blur}px)`:'none'}

// ---- captions
function buildCaps(){
  const root=$('cap');
  CAPS.forEach((c,ci)=>{
    const d=document.createElement('div');d.className='chunk';d.id='c'+ci;d.style.display='none';if(c.hook)d.style.top='405px';
    c.lines.forEach(l=>{
      const ld=document.createElement('span');ld.className='line';
      const hero=l.some(w=>w.h), small=c.lines.some(x=>x.some(w=>w.h))&&!hero;
      if(small) ld.classList.add('small');
      l.forEach((w,i)=>{
        const s=document.createElement('span');s.className='w'+(w.a?' acc':'')+(w.h?' hero':'');s.textContent=w.w;
        w.el=s;ld.appendChild(s);if(i<l.length-1)ld.appendChild(document.createTextNode(' '));
      });
      d.appendChild(ld);
    });
    root.appendChild(d);c.el=d;
  });
}
function renderCaps(t){
  CAPS.forEach(c=>{
    const on=t>=c.start-0.06&&t<c.end;
    c.el.style.display=on?'block':'none';
    if(!on)return;
    const out=clamp((c.end-t)/0.09);
    c.el.style.opacity=out;
    c.lines.forEach(l=>l.forEach((w,i)=>{
      const d=w.h?0.32:0.24;
      const k=p(t,l[0].t-0.08+i*0.035,d);   // whole line appears together, soft stagger
      reveal(w.el,k,w.h?26:16,w.h?14:8);
      let sc=w.h?0.92+0.08*k:1;
      if(w.pulse!==undefined){const u=(t-w.pulse)/0.42;if(u>0&&u<1)sc*=1+0.13*Math.sin(Math.PI*u)*(1-u*0.3);}
      if(sc!==1)w.el.style.transform+=` scale(${sc})`;
    }));
  });
}

// ---- G1: meetings list (13.6 - 19.3)
const G1={in:14.40,out:19.22,cards:[14.52,15.28,15.98,16.66,17.30]};
function buildG1(){
  const r=$('g1cards');
  G1.cards.forEach((t0,i)=>{
    const c=document.createElement('div');c.className='card';c.style.top=(665+i*122)+'px';
    c.innerHTML=`<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18"/></svg><span class="t">reunião</span><span class="s">SEMANA ${i+1}</span>`;
    r.appendChild(c);G1['c'+i]=c;
  });
}
function renderG1(t){
  const vis=t>G1.in-0.01&&t<G1.out+0.35;const g=$('g1');
  g.style.display=vis?'block':'none';if(!vis)return;
  g.style.opacity=Math.min(p(t,G1.in,0.32),1-eio((t-G1.out)/0.3));
  reveal($('g1k'),p(t,G1.in+0.05,0.4),10,4);
  G1.cards.forEach((t0,i)=>reveal(G1['c'+i],p(t,t0,0.34),28,6));
  const b=p(t,17.58,0.3);$('g1bar').style.opacity=b;$('g1bl').style.opacity=b*0.9;
  $('g1bar').firstChild.style.width=(4+38*eio((t-17.6)/1.3))+'%';
}

// ---- G2: same day timeline (32.58 - 38.52)
const G2={in:32.50,out:38.30};
function renderG2(t){
  const vis=t>G2.in-0.01&&t<G2.out+0.35;const g=$('g2');
  g.style.display=vis?'block':'none';if(!vis)return;
  g.style.opacity=Math.min(p(t,G2.in,0.32),1-eio((t-G2.out)/0.3));
  reveal($('g2h'),p(t,32.88,0.45),20,8);
  $('g2line').style.height=(eio((t-33.3)/0.8)*230+eio((t-34.8)/0.7)*250)+'px';
  const n1=p(t,33.96,0.3);$('g2n1').style.opacity=n1;$('g2n1').style.transform=`scale(${n1})`;
  reveal($('g2l1'),p(t,33.96,0.3),10,4);
  const pl=p(t,34.52,0.28);reveal($('g2p'),pl,18,6);$('g2p').style.transform+=` scale(${0.9+0.1*pl})`;
  const n2=p(t,34.88,0.3);$('g2n2').style.opacity=n2;$('g2n2').style.transform=`scale(${n2})`;
  reveal($('g2l2'),p(t,34.88,0.3),10,4);
  reveal($('g2b'),p(t,35.80,0.3),18,6);
  reveal($('g2b2'),p(t,36.30,0.3),12,8);
  const tg=p(t,37.00,0.26);reveal($('g2tag'),tg,10,4);$('g2tag').style.transform+=` scale(${0.8+0.2*tg})`;
}

// ---- G3: our rule (45.28 - 48.8)
const G3={in:45.12,out:48.62};
function renderG3(t){
  const vis=t>G3.in-0.01&&t<G3.out+0.35;const g=$('g3');
  g.style.display=vis?'block':'none';if(!vis)return;
  g.style.opacity=Math.min(p(t,G3.in,0.3),1-eio((t-G3.out)/0.3));
  reveal($('g3k'),p(t,45.2,0.35),10,4);
  reveal($('g3doc'),p(t,45.22,0.35),20,6);
  const sig=$('g3sig'),L=sig.getTotalLength();sig.style.strokeDasharray=L;sig.style.strokeDashoffset=L*(1-eio((t-45.45)/0.7));
  const ws=$('g3t').querySelectorAll('.w');[45.24,45.275,45.31].forEach((t0,i)=>reveal(ws[i],p(t,t0,0.24),16,8));
  reveal($('g3r1'),p(t,46.08,0.32),20,6);
  reveal($('g3d'),p(t,46.66,0.34),14,10);
  reveal($('g3r2'),p(t,47.32,0.32),20,6);
  reveal($('g3s'),p(t,48.20,0.3),14,10);
  $('g3strike').style.width=(eio((t-48.42)/0.3)*104)+'%';
}

window.setup=(caps,opts)=>{CAPS=caps;if(opts&&opts.caps){document.body.classList.add('caps');document.querySelectorAll('.card .t').forEach(e=>e.classList.add('capsable'));}buildCaps();buildG1();document.querySelectorAll('.card .t').forEach(e=>{if(opts&&opts.caps)e.classList.add('capsable')});};
window.render=(t)=>{renderG1(t);renderG2(t);renderG3(t);renderCaps(t);};
</script>
</body></html>
