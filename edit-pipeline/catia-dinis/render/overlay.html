<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;font-weight:600;src:url(node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2)}
@font-face{font-family:InterTight;font-weight:800;src:url(node_modules/@fontsource/inter-tight/files/inter-tight-latin-800-normal.woff2)}
@font-face{font-family:InterTight;font-weight:900;src:url(node_modules/@fontsource/inter-tight/files/inter-tight-latin-900-normal.woff2)}
@font-face{font-family:Serif;font-style:italic;src:url(node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2)}
@font-face{font-family:Serif;font-style:normal;src:url(node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-normal.woff2)}
:root{--cream:#F4ECE1;--amber:#F2B24C;--ink:#1C1915;--paper:#EDE5D6}
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
*{box-sizing:border-box}
.abs{position:absolute}
#root{position:absolute;inset:0}
/* ---- captions ABOVE the head (white t-shirt): small label + big condensed word / serif italic ---- */
#cap{position:absolute;left:120px;right:120px;top:0;height:1920px}
.chunk{position:absolute;left:0;right:0;top:470px;transform:translateY(-50%);text-align:center;
  text-shadow:0 2px 22px rgba(0,0,0,.34),0 1px 3px rgba(0,0,0,.3)}
.it{display:block;white-space:nowrap}
.label{font-family:Inter;font-weight:700;font-size:33px;letter-spacing:.17em;text-transform:uppercase;color:#fff;line-height:1.25;margin-bottom:4px}
.big{font-family:InterTight;font-weight:800;font-size:112px;text-transform:uppercase;line-height:.96;color:#fff}
.serif{font-family:Serif;font-style:italic;font-size:132px;line-height:.92;color:var(--cream);letter-spacing:0}
.acc{color:var(--amber)}
/* ---- hook 0€ ---- */
#hook{position:absolute;left:120px;right:120px;top:0;height:1920px;display:none;text-shadow:0 4px 30px rgba(0,0,0,.3)}
#hkL{position:absolute;left:0;right:0;top:318px;text-align:center}
#zero{position:absolute;left:0;right:0;top:372px;text-align:center;font-family:InterTight;font-weight:900;font-size:290px;line-height:1;letter-spacing:-.03em;color:var(--amber);white-space:nowrap}
#zd{display:inline-block;height:1em;overflow:hidden;vertical-align:top}
#zs{display:block;will-change:transform}#zs span{display:block;height:1em}
#ze{display:inline-block;vertical-align:top}
/* ---- editorial paper ---- */
.sheet{position:absolute;inset:-40px;display:none;transform-origin:50% 50%}
.paperbg{position:absolute;inset:0;background-color:var(--paper);
  background-image:radial-gradient(ellipse 70% 55% at 50% 45%,rgba(255,252,245,.45),rgba(255,252,245,0) 70%),
    radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 58%,rgba(70,48,25,.30) 100%),
    linear-gradient(rgba(125,98,70,.17) 1.5px,transparent 1.5px),linear-gradient(90deg,rgba(125,98,70,.17) 1.5px,transparent 1.5px);
  background-size:auto,auto,60px 60px,60px 60px;background-position:0 0,0 0,10px 22px,10px 22px;box-shadow:0 -30px 60px rgba(0,0,0,.35)}
.grain{position:absolute;inset:0;opacity:.22;mix-blend-mode:multiply}
.inner{position:absolute;left:40px;top:40px;width:1080px;height:1920px}
.strip{position:absolute;filter:drop-shadow(0 7px 9px rgba(40,25,10,.22)) drop-shadow(0 1px 1px rgba(40,25,10,.25))}
.strip>div{background:#FBF8F1;padding:14px 34px 12px 30px;font-family:Serif;font-size:62px;line-height:1.05;color:var(--ink);white-space:nowrap}
.strip.sm>div{font-size:44px;padding:10px 24px 8px 22px}
.strip.dk>div{background:#F6F1E7}
.mk{background-image:linear-gradient(rgba(242,178,76,.85),rgba(242,178,76,.85));background-repeat:no-repeat;background-position:0 72%;background-size:0% 55%;padding:0 4px}
.day{font-family:Serif;font-size:34px;fill:#1C1915;opacity:.8}
.wd{font-family:Serif;font-style:italic;font-size:36px;fill:#1C1915;opacity:.6}
/* ---- rule over my own blurred shot ---- */
#gR{position:absolute;inset:0;display:none}
#rDark{position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 45%,rgba(8,7,6,.46),rgba(8,7,6,.72))}
#rK{position:absolute;left:0;right:0;top:500px;text-align:center;font-family:Inter;font-weight:700;font-size:30px;letter-spacing:.42em;color:rgba(255,255,255,.75)}
/* ---- CTA ---- */
#cta{position:absolute;left:120px;right:120px;top:0;height:1920px;display:none;text-shadow:0 4px 30px rgba(0,0,0,.3)}
#ico{position:absolute;left:50%;top:268px;width:112px;height:112px;margin-left:-56px}
#ctaL{position:absolute;left:0;right:0;top:404px;text-align:center}
#reu{position:absolute;left:0;right:0;top:446px;text-align:center;font-family:InterTight;font-weight:900;font-size:190px;line-height:1;letter-spacing:-.02em;color:var(--amber);white-space:nowrap}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="4"/><feDisplacementMap in="SourceGraphic" scale="4.5"/></filter>
  <filter id="vb" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur id="vbg" stdDeviation="0 0"/></filter>
  <filter id="markerF" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="2"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter>
</defs></svg>
<div id="root">
<!-- hook -->
<div id="hook"><span id="hkL" class="it label">e ganhámos</span><div id="zero"><span id="zd"><span id="zs"></span></span><span id="ze">€</span></div>
</div>
<!-- calendar paper: "mais de um mês, reunião atrás de reunião" -->
<div id="gK" class="sheet"><div class="paperbg"></div>
  <svg class="grain" width="1160" height="2000"><filter id="gr"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" seed="9"/><feColorMatrix values="0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .2  0 0 0 .9 0"/></filter><rect width="100%" height="100%" filter="url(#gr)"/></svg>
  <div class="inner">
    <div class="strip" id="k1" style="left:150px;top:350px"><div>Mais de um mês,</div></div>
    <div class="strip" id="k2" style="left:260px;top:446px"><div>reunião atrás de <span class="mk" id="mkR">reunião.</span></div></div>
    <svg id="cal" class="abs" width="1080" height="1920" style="left:0;top:0">
      <g id="calG" filter="url(#rough)" fill="none" stroke="#1C1915" stroke-width="3.2" stroke-linecap="round"></g>
      <g id="calT"></g>
      <g id="calM" filter="url(#markerF)" fill="none" stroke="#F2B24C" stroke-width="7" stroke-linecap="round" opacity=".95"></g>
    </svg>
    <div class="strip sm dk" id="n1" style="left:150px;top:1268px"><div>estratégia de marca</div></div>
    <div class="strip sm dk" id="n2" style="left:560px;top:1262px"><div>ideias de conteúdo</div></div>
    <div class="strip sm dk" id="n3" style="left:170px;top:1352px"><div>truques de redes sociais</div></div>
    <div class="strip sm dk" id="n4" style="left:640px;top:1348px"><div>como alavancar</div></div>
  </div>
</div>
<!-- rule over my blurred shot -->
<div id="gR"><div id="rDark"></div>
  <div id="rK">A NOSSA REGRA</div>
  <div class="strip" id="r1" style="left:170px;top:620px"><div>Antes de assinar:</div></div>
  <div class="strip" id="r2" style="left:250px;top:760px"><div>fazemos o diagnóstico</div></div>
  <div class="strip" id="r3" style="left:250px;top:900px"><div>apresentamos a solução</div></div>
  <svg class="abs" width="1080" height="1920" style="left:0;top:0"><g filter="url(#markerF)" fill="none" stroke="#F2B24C" stroke-linecap="round" stroke-linejoin="round">
    <path id="chk" d="M180 812 L 204 842 L 238 778" stroke-width="10"/>
    <path id="strike" d="M262 944 C 420 936, 640 950, 868 938" stroke-width="9"/>
    <path id="xx1" d="M186 912 L 232 962" stroke-width="10"/><path id="xx2" d="M232 912 L 186 962" stroke-width="10"/>
  </g></svg>
</div>
<!-- CTA -->
<div id="cta">
  <svg id="ico" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linejoin="round"><path d="M20.66 16.4A9.5 9.5 0 1 0 17.3 20l3.7 1-1.1-3.5z"/></svg>
  <span id="ctaL" class="it label">comenta</span>
  <div id="reu"></div>
</div>
<div id="cap"></div>
</div>
<script>
const clamp=x=>Math.max(0,Math.min(1,x));
const eo=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const eo5=x=>{x=clamp(x);return 1-Math.pow(1-x,5)};
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const p=(t,t0,d)=>eo((t-t0)/d);
const $=id=>document.getElementById(id);
function reveal(el,k,dy=16,blur=8){el.style.opacity=k;el.style.transform=`translateY(${(1-k)*dy}px)`;el.style.filter=k<1&&k>0?`blur(${(1-k)*blur}px)`:'none'}
function drawPath(e,k){if(typeof e==='string')e=$(e);const L=e.__L||(e.__L=e.getTotalLength());e.style.strokeDasharray=L;e.style.strokeDashoffset=L*(1-clamp(k));e.style.opacity=k>0?1:0}
function slap(el,t,t0,rot){const k=eo5((t-t0)/0.2);el.style.opacity=clamp((t-t0)/0.06);el.style.transform=`translateY(${-18*(1-k)}px) rotate(${rot}deg) scale(${1.07-0.07*k})`}
function tearClip(el,seed){let s=seed;const r=()=>{s=(s*9301+49297)%233280;return s/233280};
  const L=[],R=[];for(let y=0;y<=100;y+=8){L.push(`${(r()*1.6).toFixed(2)}% ${y}%`);R.push(`${(98.4+r()*1.6).toFixed(2)}% ${100-y}%`)}
  el.firstElementChild.style.clipPath=`polygon(${L.join(',')},${R.join(',')})`}
function handCircle(cx,cy,rx,ry,turn=1.12,seed=0){const pts=[];for(let a=0;a<=turn;a+=0.02){const th=-2.6+a*2*Math.PI,w=1+0.04*Math.sin(a*17+seed);pts.push(`${(cx+rx*w*Math.cos(th)).toFixed(1)},${(cy+ry*w*Math.sin(th)+a*8).toFixed(1)}`)}return 'M'+pts.join(' L')}
// text-only landing shake (the video shake, if wanted, is done in CapCut at the same time)
const SHAKES=[[3.42,12],[52.36,9]];
function shake(t){for(const [t0,a] of SHAKES){const u=t-t0;if(u>=0&&u<0.4){const e=Math.exp(-u/0.085);return [a*e*Math.sin(2*Math.PI*21*u),0.7*a*e*Math.sin(2*Math.PI*16*u+1.3)]}}return [0,0]}

// ---- captions (auto-fit to the safe width)
let CAPS=[];
function buildCaps(){CAPS.forEach(c=>{const d=document.createElement('div');d.className='chunk';d.style.display='none';
  c.E=c.items.map(it=>{const s=document.createElement('span');s.className='it '+it.k+(it.acc?' acc':'');s.textContent=it.k==='serif'?it.text:it.text.toUpperCase();d.appendChild(s);return s});
  $('cap').appendChild(d);c.el=d;d.style.display='block';c.E.forEach(s=>{if(s.classList.contains('big'))s.style.letterSpacing='.12em';const w=s.scrollWidth;s.style.letterSpacing='';if(w>840)s.style.fontSize=(parseFloat(getComputedStyle(s).fontSize)*840/w)+'px'});d.style.display='none'})}
function renderCaps(t){CAPS.forEach(c=>{const on=t>=c.start-0.08&&t<c.end;c.el.style.display=on?'block':'none';if(!on)return;
  const out=clamp((c.end-t)/0.09);c.el.style.opacity=out;c.el.style.filter=out<1?`blur(${(1-out)*6}px)`:'none';
  c.items.forEach((it,i)=>{const el=c.E[i];
    if(it.k==='big'){const k=p(t,it.t-0.06,0.3);reveal(el,k,22,10);el.style.letterSpacing=(-0.02+0.14*(1-eo5((t-it.t+0.06)/0.34)))+'em';el.style.transform+=` scale(${0.94+0.06*k})`}
    else if(it.k==='serif')reveal(el,p(t,it.t-0.06,0.3),20,10);else reveal(el,p(t,it.t-0.07,0.22),12,6)})})}

// ---- hook "e ganhámos 0€": slam + hand-drawn circle
function renderHook(t){const g=$('hook');const vis=t>=2.9&&t<4.6;g.style.display=vis?'block':'none';if(!vis)return;
  const out=1-eio((t-4.36)/0.22);g.style.opacity=out;g.style.filter=out<1?`blur(${(1-out)*8}px)`:'none';
  reveal($('hkL'),p(t,2.94,0.22),12,6);
  // digits roll like a counter and lock on 0 exactly on the word "0€" (3.42), then € slides in
  const z=$('zero');z.style.opacity=clamp((t-2.98)/0.08);
  const pos=ZN*eo5((t-3.00)/0.42),v=ZN*(eo5((t-3.00)/0.42)-eo5((t-3.00-1/60)/0.42))*60*290;
  $('zs').style.transform=`translateY(${-pos}em)`;$('vbg').setAttribute('stdDeviation',`0 ${Math.min(v/260,34)}`);$('zd').style.filter=v>40?'url(#vb)':'none';
  const ke=eo5((t-3.42)/0.16);$('ze').style.opacity=clamp((t-3.42)/0.05);$('ze').style.transform=`translateX(${(1-ke)*120}px)`;$('ze').style.filter=ke<1?`blur(${(1-ke)*10}px)`:'none';
  const u=(t-3.42)/0.3;z.style.transform=`scale(${1+(u>0&&u<1?0.06*Math.sin(Math.PI*u):0)})`}

// ---- calendar paper (13.5 → 19.0)
const K={in:13.50,out:18.98};const MEET=[1,2,3,6,7,8,9,10,13,14,15,16,17,20,21,22,23,24,27,28,29,30,31];
function buildK(){const g=$('calG'),tx=$('calT'),m=$('calM');const x0=150,x1=930,y0=640,y1=1230,cw=(x1-x0)/7,rh=(y1-y0)/5;
  const ns='http://www.w3.org/2000/svg';const P=(d,par)=>{const e=document.createElementNS(ns,'path');e.setAttribute('d',d);par.appendChild(e);return e};
  K.lines=[];for(let r=0;r<=5;r++){const y=y0+r*rh;K.lines.push(P(`M${x0} ${y+(r%2?2:-1)} C ${x0+260} ${y+3}, ${x1-260} ${y-3}, ${x1} ${y+(r%2?-1:2)}`,g))}
  for(let c=0;c<=7;c++){const x=x0+c*cw;K.lines.push(P(`M${x+(c%2?2:-1)} ${y0} C ${x+3} ${y0+200}, ${x-3} ${y1-200}, ${x+(c%2?-1:2)} ${y1}`,g))}
  'STQQSSD'.split('').forEach((d,i)=>{const e=document.createElementNS(ns,'text');e.setAttribute('class','wd');e.setAttribute('x',x0+i*cw+cw/2);e.setAttribute('y',y0-22);e.setAttribute('text-anchor','middle');e.textContent=d;tx.appendChild(e)});
  K.days=[];for(let d=1;d<=31;d++){const i=d+1,r=Math.floor(i/7),c=i%7;if(r>4)break;const e=document.createElementNS(ns,'text');e.setAttribute('class','day');e.setAttribute('x',x0+c*cw+14);e.setAttribute('y',y0+r*rh+40);e.textContent=d;tx.appendChild(e);K.days.push(e);
    if(MEET.includes(d)){const cx=x0+c*cw+cw/2+6,cy=y0+r*rh+rh/2+10;K['m'+d]=[P(`M${cx-30} ${cy-26} L ${cx+30} ${cy+28}`,m),P(`M${cx+30} ${cy-28} L ${cx-28} ${cy+26}`,m)]}}}
function renderK(t){const g=$('gK');const vis=t>=K.in&&t<K.out+0.32;g.style.display=vis?'block':'none';if(!vis)return;
  const kin=eo5((t-K.in)/0.36),kout=eio((t-K.out)/0.3);g.style.transform=`translateY(${(1-kin)*1980-kout*1980}px) rotate(${(1-kin)*-4+kout*3}deg) scale(${1+0.022*clamp((t-K.in)/(K.out-K.in))})`;
  slap($('k1'),t,13.62,-1.6);slap($('k2'),t,14.50,1.2);$('mkR').style.backgroundSize=`${100*eio((t-15.28)/0.24)}% 55%`;
  K.lines.forEach((e,i)=>drawPath(e,(t-13.78-i*0.025)/0.3));
  const dk=clamp((t-13.9)/0.5);K.days.forEach((e,i)=>e.style.opacity=clamp(dk*K.days.length-i)*0.8);
  MEET.forEach((d,i)=>{const t0=14.60+i*0.085;drawPath(K['m'+d][0],(t-t0)/0.05);drawPath(K['m'+d][1],(t-t0-0.04)/0.05)});
  [['n1',16.66,-2],['n2',16.90,1.6],['n3',17.14,1.2],['n4',17.38,-1.8]].forEach(([id,t0,r])=>slap($(id),t,t0,r))}

// ---- the rule (43.9 → 49.35), over my own blurred shot (blur clip delivered separately)
const R={in:43.90,out:49.34};
function renderR(t){const g=$('gR');const vis=t>R.in-0.01&&t<R.out+0.3;g.style.display=vis?'block':'none';if(!vis)return;
  g.style.opacity=Math.min(p(t,R.in,0.3),1-eio((t-R.out)/0.26));
  reveal($('rK'),p(t,44.46,0.3),10,6);slap($('r1'),t,45.26,-1.4);slap($('r2'),t,46.08,1.0);slap($('r3'),t,47.30,-0.8);
  drawPath('chk',(t-46.70)/0.22);drawPath('strike',(t-47.86)/0.3);drawPath('xx1',(t-48.10)/0.1);drawPath('xx2',(t-48.20)/0.1)}

// ---- CTA: comment icon + REUNIÃO typed big
function renderCTA(t){const g=$('cta');const vis=t>=51.72&&t<53.42;g.style.display=vis?'block':'none';if(!vis)return;
  const out=1-eio((t-53.18)/0.22);g.style.opacity=out;g.style.filter=out<1?`blur(${(1-out)*8}px)`:'none';
  const ki=eo5((t-51.76)/0.24),pop=1+0.2*Math.sin(Math.PI*clamp((t-51.76)/0.3));$('ico').style.opacity=clamp((t-51.76)/0.06);$('ico').style.transform=`scale(${(0.5+0.5*ki)*pop})`;
  $('ico').querySelector('path').setAttribute('fill',t>52.0?'rgba(255,255,255,.95)':'none');
  reveal($('ctaL'),p(t,51.86,0.22),12,6);
  const W='REUNIÃO';const n=Math.max(0,Math.min(W.length,Math.floor((t-52.30)/0.045)+1));$('reu').textContent=t<52.30?'':W.slice(0,n);
  const k=eo5((t-52.30)/0.2);$('reu').style.transform=`scale(${1.12-0.12*k})`}

const ZD='3749162850736418295';const ZN=ZD.length;
function buildHook(){$('zs').innerHTML=(ZD+'0').split('').map(d=>`<span>${d}</span>`).join('')}
window.setup=(caps)=>{CAPS=caps;buildHook();buildCaps();buildK();['k1','k2','n1','n2','n3','n4','r1','r2','r3'].forEach((id,i)=>tearClip($(id),7+i*13))};
window.render=(t,layer)=>{if(layer==='back')return false;
  const [dx,dy]=shake(t);$('root').style.transform=`translate(${dx}px,${dy}px)`;
  renderHook(t);renderK(t);renderR(t);renderCTA(t);renderCaps(t);return true};
</script>
</body></html>
