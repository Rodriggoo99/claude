<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;font-weight:600;src:url(node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2)}
@font-face{font-family:Inter;font-weight:800;src:url(node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2)}
@font-face{font-family:Serif;font-style:italic;src:url(node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2)}
:root{--ink:#fff;--cream:#F4ECE1;--navy0:#080B12;--navy1:#131C2C;--pill:#E4EAF4;--muted:rgba(255,255,255,.5)}
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
*{box-sizing:border-box}
.abs{position:absolute}
#cap{position:absolute;left:60px;right:60px;top:0;height:1920px}
.chunk{position:absolute;left:0;right:0;top:470px;transform:translateY(-50%);text-align:center;text-transform:uppercase;
  font-family:Inter;font-weight:800;font-size:46px;line-height:1.2;letter-spacing:.012em;color:var(--ink);
  text-shadow:0 2px 18px rgba(0,0,0,.30),0 1px 3px rgba(0,0,0,.28)}
.line{display:block;white-space:nowrap}
.w{display:inline-block}
.acc{font-family:Serif;font-style:italic;font-weight:400;font-size:1.22em;letter-spacing:.02em;color:var(--cream);line-height:.9}
.hero{font-size:150px;line-height:1.02}
.hero .w{margin:0 .11em;font-family:Serif;font-style:italic;font-weight:400;font-size:1em;line-height:1;letter-spacing:0;color:var(--cream)}
.small{font-size:38px;font-weight:700;letter-spacing:.05em}
.bg{position:absolute;inset:0;background:linear-gradient(180deg,var(--navy0) 0%,#0E1522 30%,var(--navy1) 52%,#0D1320 72%,var(--navy0) 100%)}
.g{position:absolute;inset:0;opacity:0;display:none}
.kicker{font-family:Inter;font-weight:600;font-size:25px;letter-spacing:.42em;color:var(--muted);text-transform:uppercase}
.card{position:absolute;left:130px;width:820px;height:100px;border:2px solid rgba(255,255,255,.2);border-radius:22px;
  background:rgba(255,255,255,.035);display:flex;align-items:center;padding:0 26px 0 30px;gap:22px}
.card .t{font-family:Inter;font-weight:700;font-size:34px;color:#fff;letter-spacing:.02em;flex:1}
.card .p{font-family:Inter;font-weight:600;font-size:34px;color:rgba(255,255,255,.85);font-variant-numeric:tabular-nums;min-width:150px;text-align:right}
.tag{font-family:Inter;font-weight:800;font-size:20px;letter-spacing:.24em;background:var(--pill);color:#0B0F17;border-radius:40px;padding:10px 16px 10px 20px}
.ico{width:40px;height:40px;flex:none}
.barlbl{position:absolute;left:130px;width:820px;display:flex;justify-content:space-between;align-items:baseline}
.barlbl .k{font-family:Inter;font-weight:700;font-size:30px;letter-spacing:.2em;color:#fff}
.barlbl .arrow{font-family:Serif;font-style:italic;font-size:64px;color:var(--cream);line-height:1}
.track{position:absolute;left:130px;width:820px;height:34px;border-radius:34px;background:rgba(255,255,255,.1);overflow:hidden}
.track i{display:block;height:100%;border-radius:34px}
#gB{position:absolute;left:150px;width:780px;top:1060px;height:340px;border-radius:36px;background:rgba(10,14,24,.9);
  border:1.5px solid rgba(255,255,255,.16);box-shadow:0 24px 60px rgba(0,0,0,.35);opacity:0;display:none}
.col{position:absolute;top:28px;width:330px}
.col .kicker{font-size:22px;margin-bottom:18px;text-align:center}
.chip{height:48px;border-radius:14px;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:12px;
  font-family:Inter;font-weight:800;font-size:24px;letter-spacing:.2em}
.chip.no{background:var(--cream);color:#0B0F17}
.chip.yes{border:2px solid rgba(255,255,255,.3);color:rgba(255,255,255,.75)}
.q{font-family:Serif;font-style:italic;color:#fff;text-align:center;position:absolute;left:0;right:0}
</style></head>
<body>
<!-- Screen A: projects accepted at any price, then work vs revenue -->
<div id="gA" class="g"><div class="bg"></div>
  <div id="aK" class="kicker abs" style="top:590px;width:100%;text-align:center">pedidos recebidos</div>
  <div id="aCards"></div>
  <div id="aBars">
    <div class="barlbl" id="b1l" style="top:690px"><span class="k">HORAS DE TRABALHO</span><span class="arrow">↑</span></div>
    <div class="track" id="b1t" style="top:760px"><i id="b1" style="background:#fff;width:30%"></i></div>
    <div class="barlbl" id="b2l" style="top:880px"><span class="k">FATURAÇÃO</span><span class="arrow">↓</span></div>
    <div class="track" id="b2t" style="top:950px"><i id="b2" style="background:var(--cream);width:70%"></i></div>
  </div>
</div>
<!-- Screen B: floating card, more NO than YES -->
<div id="gB">
  <div class="col" style="left:40px"><div class="kicker" id="bKn">NÃO</div><div id="noCol"></div></div>
  <div class="col" style="left:410px"><div class="kicker" id="bKy">SIM</div><div id="yesCol"></div></div>
  <div class="abs" style="left:389px;top:34px;width:1.5px;height:272px;background:rgba(255,255,255,.12)"></div>
</div>
<!-- Screen C: the quote -->
<div id="gC" class="g"><div class="bg"></div>
  <div id="cK" class="kicker abs" style="top:560px;width:100%;text-align:center">a frase</div>
  <div id="cMark" class="q" style="top:560px;font-size:260px;line-height:1;color:var(--cream);opacity:.9">“</div>
  <div id="cQ" class="q" style="top:800px;font-size:108px;line-height:1.06"></div>
  <div id="cUl" class="abs" style="height:4px;background:var(--cream);border-radius:4px;width:0"></div>
</div>
<svg id="bm" class="abs" style="left:504px;top:312px;width:72px;height:88px;opacity:0" viewBox="0 0 24 30">
  <path id="bmp" d="M3 3.5A2.5 2.5 0 0 1 5.5 1h13A2.5 2.5 0 0 1 21 3.5V28l-9-6.2L3 28z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
</svg>
<div id="cap"></div>
<script>
const clamp=x=>Math.max(0,Math.min(1,x));
const eo=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const p=(t,t0,d)=>eo((t-t0)/d);
const $=id=>document.getElementById(id);
function reveal(el,k,dy=16,blur=8){el.style.opacity=k;el.style.transform=`translateY(${(1-k)*dy}px)`;el.style.filter=k<1&&k>0?`blur(${(1-k)*blur}px)`:'none'}
function fadeScreen(el,t,tin,tout,d=0.28){const vis=t>tin-0.01&&t<tout+d+0.01;el.style.display=vis?'block':'none';if(vis)el.style.opacity=Math.min(p(t,tin,d),1-eio((t-tout)/d));return vis}
let CAPS=[];

function buildCaps(){
  CAPS.forEach((c,ci)=>{
    const d=document.createElement('div');d.className='chunk';d.style.display='none';if(c.hook)d.style.top='420px';
    c.L=c.lines.map(l=>{
      const ld=document.createElement('span');ld.className='line';
      let txt=l.text;const hero=txt.startsWith('#');if(hero){txt=txt.slice(1);ld.classList.add('hero')}
      if(l.small)ld.classList.add('small');if(l.size)ld.style.fontSize=l.size+'px';
      const ws=txt.split(' ').map((w,i,arr)=>{const s=document.createElement('span');const acc=/^\*.*\*$/.test(w);
        s.className='w'+(acc?' acc':'');s.textContent=w.replace(/\*/g,'');ld.appendChild(s);if(i<arr.length-1)ld.appendChild(document.createTextNode(' '));return s});
      d.appendChild(ld);return {l,ws,hero};
    });
    $('cap').appendChild(d);c.el=d;
  });
}
function renderCaps(t){
  CAPS.forEach(c=>{
    const on=t>=c.start-0.08&&t<c.end;c.el.style.display=on?'block':'none';if(!on)return;
    c.el.style.opacity=clamp((c.end-t)/0.08);
    c.L.forEach(({l,ws,hero})=>ws.forEach((w,i)=>{
      const k=p(t,l.t-0.07+i*0.03,hero?0.3:0.22);reveal(w,k,hero?24:14,hero?12:7);
      let sc=hero?0.92+0.08*k:1;
      if(l.pulse!==undefined){const u=(t-l.pulse)/0.4;if(u>0&&u<1)sc*=1+0.08*Math.sin(Math.PI*u)*(1-u*0.3)}
      if(sc!==1)w.style.transform+=` scale(${sc})`;
    }));
    c.lines.forEach(l=>{if(l.bookmark!==undefined){renderBookmark(t,l.bookmark,c.end)}});
  });
}
function renderBookmark(t,t0,tend){
  const k=p(t,t0-0.05,0.25),o=Math.min(k,clamp((tend-t)/0.1));const bm=$('bm');bm.style.opacity=o;
  const u=(t-t0)/0.35;const s=0.6+0.4*k+(u>0&&u<1?0.18*Math.sin(Math.PI*u):0);bm.style.transform=`scale(${s})`;
  $('bmp').setAttribute('fill',t>t0+0.08?'#F4ECE1':'none');$('bmp').setAttribute('stroke',t>t0+0.08?'#F4ECE1':'#fff');
}

// ---- Screen A
const A={in:4.92,out:8.80,cards:[5.10,5.40,5.70,6.00,6.30],p0:[1200,900,750,600,450],p1:[300,150,200,90,50]};
function buildA(){
  A.cards.forEach((t0,i)=>{const c=document.createElement('div');c.className='card';c.style.top=(650+i*116)+'px';
    c.innerHTML=`<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7"/></svg><span class="t">NOVO PROJETO</span><span class="p"></span><span class="tag">ACEITE</span>`;
    $('aCards').appendChild(c);A['c'+i]=c;});
}
function renderA(t){
  if(!fadeScreen($('gA'),t,A.in,A.out))return;
  const cardsOut=eio((t-6.98)/0.3);
  reveal($('aK'),p(t,A.in+0.05,0.35)*(1-cardsOut),10,4);
  A.cards.forEach((t0,i)=>{const c=A['c'+i];reveal(c,p(t,t0,0.3)*(1-cardsOut),26,6);if(cardsOut>0)c.style.transform=`translateY(${-40*cardsOut}px)`;
    const tag=c.querySelector('.tag');const tk=p(t,t0+0.14,0.22);tag.style.opacity=tk;tag.style.transform=`scale(${0.7+0.3*tk})`;
    const f=eio((t-6.16-i*0.06)/0.7);const v=Math.round(A.p0[i]+(A.p1[i]-A.p0[i])*f);
    const pe=c.querySelector('.p');pe.textContent=v.toLocaleString('pt-PT')+'€';pe.style.color=f>0?`rgba(255,255,255,${0.85-0.35*f})`:'';});
  const bIn=p(t,7.12,0.32);['b1l','b1t','b2l','b2t'].forEach((id,i)=>reveal($(id),p(t,7.12+i*0.06,0.32),20,5));
  $('b1').style.width=(30+66*eio((t-7.5)/0.7))+'%';
  $('b2').style.width=(70-48*eio((t-8.42)/0.5))+'%';
}
// ---- Screen B (floating)
const B={in:14.30,out:16.62,no:[15.56,15.68,15.80,15.92],yes:[16.32]};
function buildB(){
  B.no.forEach(()=>{const c=document.createElement('div');c.className='chip no';c.innerHTML='<span>✕</span><span>NÃO</span>';$('noCol').appendChild(c)});
  B.yes.forEach(()=>{const c=document.createElement('div');c.className='chip yes';c.innerHTML='<span>✓</span><span>SIM</span>';$('yesCol').appendChild(c)});
}
function renderB(t){
  const g=$('gB');const vis=t>B.in-0.01&&t<B.out+0.3;g.style.display=vis?'block':'none';if(!vis)return;
  const k=Math.min(p(t,B.in,0.34),1-eio((t-B.out)/0.28));g.style.opacity=k;g.style.transform=`translateY(${(1-k)*40}px) scale(${0.96+0.04*k})`;
  $('noCol').querySelectorAll('.chip').forEach((c,i)=>{const kk=p(t,B.no[i],0.22);reveal(c,kk,18,4);c.style.transform+=` scale(${0.85+0.15*kk})`});
  $('yesCol').querySelectorAll('.chip').forEach((c,i)=>{const kk=p(t,B.yes[i],0.22);reveal(c,kk,18,4)});
  reveal($('bKn'),p(t,B.in+0.1,0.3),8,3);reveal($('bKy'),p(t,B.in+0.16,0.3),8,3);
}
// ---- Screen C (quote)
const C={in:21.52,out:24.30,lines:[[21.68,'Cada <span class="acc2">sim</span>'],[22.16,'a algo mau'],[22.88,'é um <span class="acc2">não</span>'],[23.60,'a algo <span id="best">melhor.</span>']]};
function buildC(){C.L=C.lines.map(([t0,h])=>{const d=document.createElement('div');d.innerHTML=h;$('cQ').appendChild(d);return [t0,d]});
  const st=document.createElement('style');st.textContent='.acc2{color:#F4ECE1}';document.head.appendChild(st);}
function renderC(t){
  if(!fadeScreen($('gC'),t,C.in,C.out))return;
  reveal($('cK'),p(t,C.in+0.05,0.3),8,3);$('cK').style.top='520px';
  reveal($('cMark'),p(t,C.in+0.08,0.4),20,8);$('cMark').style.top='560px';
  C.L.forEach(([t0,d],i)=>{reveal(d,p(t,t0-0.06,0.3),18,9);if(i==1)d.style.color='rgba(255,255,255,.55)';});
  const b=$('best');if(b){const r=b.getBoundingClientRect();const ul=$('cUl');ul.style.left=r.left+'px';ul.style.top=(r.bottom-10)+'px';ul.style.width=(r.width*eio((t-23.98)/0.35))+'px';}
}
window.setup=(caps)=>{CAPS=caps;buildCaps();buildA();buildB();buildC();};
window.render=(t)=>{renderA(t);renderB(t);renderC(t);renderCaps(t);if(!CAPS.some(c=>c.lines.some(l=>l.bookmark!==undefined)&&t>=c.start-0.08&&t<c.end))$('bm').style.opacity=0;};
</script>
</body></html>
