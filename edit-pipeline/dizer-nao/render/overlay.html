<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;font-weight:600;src:url(node_modules/@fontsource/inter/files/inter-latin-600-normal.woff2)}
@font-face{font-family:Inter;font-weight:700;src:url(node_modules/@fontsource/inter/files/inter-latin-700-normal.woff2)}
@font-face{font-family:Inter;font-weight:800;src:url(node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2)}
@font-face{font-family:InterTight;font-weight:800;src:url(node_modules/@fontsource/inter-tight/files/inter-tight-latin-800-normal.woff2)}
@font-face{font-family:InterTight;font-weight:900;src:url(node_modules/@fontsource/inter-tight/files/inter-tight-latin-900-normal.woff2)}
@font-face{font-family:Serif;font-style:italic;src:url(node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2)}
:root{--ink:#fff;--cream:#F4ECE1;--amber:#F2B24C;--navy0:#080B12;--navy1:#131C2C;--pill:#E4EAF4;--muted:rgba(255,255,255,.5)}
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
*{box-sizing:border-box}
.abs{position:absolute}
#root{position:absolute;inset:0}
body.back #front{display:none}
body.front #back{display:none}
/* ---- chest captions: small label + big condensed word / serif italic ---- */
#cap{position:absolute;left:60px;right:120px;top:0;height:1920px}
.chunk{position:absolute;left:0;right:0;top:1272px;transform:translateY(-50%);text-align:center;
  text-shadow:0 2px 22px rgba(0,0,0,.34),0 1px 3px rgba(0,0,0,.3)}
.it{display:block;white-space:nowrap}
.label{font-family:Inter;font-weight:700;font-size:33px;letter-spacing:.17em;text-transform:uppercase;color:#fff;line-height:1.25;margin-bottom:4px}
.big{font-family:InterTight;font-weight:800;font-size:112px;text-transform:uppercase;line-height:.96;color:#fff}
.serif{font-family:Serif;font-style:italic;font-size:132px;line-height:.92;color:var(--cream);letter-spacing:0}
.acc{color:var(--amber)}
.dim{color:rgba(255,255,255,.62)}
/* ---- giant words behind me ---- */
.giant{position:absolute;left:0;width:1080px;text-align:center;white-space:nowrap;will-change:transform}
#hookNao{top:500px;font-family:InterTight;font-weight:900;font-size:400px;line-height:1;letter-spacing:-.035em;color:var(--amber);
  text-shadow:0 10px 40px rgba(0,0,0,.18)}
.ghost{opacity:0}
#chega{top:510px;font-family:Serif;font-style:italic;font-size:300px;line-height:1;color:var(--cream);text-shadow:0 8px 36px rgba(0,0,0,.2)}
/* ---- scattered NÃO around my head ---- */
.nao{position:absolute;white-space:nowrap;transform-origin:50% 60%;text-shadow:0 2px 16px rgba(0,0,0,.25)}
.nao.t{font-family:InterTight;font-weight:900;text-transform:uppercase;letter-spacing:-.02em}
.nao.s{font-family:Serif;font-style:italic}
/* ---- screens (kept from v1) ---- */
.bg{position:absolute;inset:0;background:linear-gradient(180deg,var(--navy0) 0%,#0E1522 30%,var(--navy1) 52%,#0D1320 72%,var(--navy0) 100%)}
.g{position:absolute;inset:0;opacity:0;display:none}
.kicker{font-family:Inter;font-weight:600;font-size:25px;letter-spacing:.42em;color:var(--muted);text-transform:uppercase}
.card{position:absolute;left:130px;width:820px;height:96px;border:2px solid rgba(255,255,255,.2);border-radius:22px;
  background:rgba(255,255,255,.035);display:flex;align-items:center;padding:0 26px 0 30px;gap:22px}
.card .t{font-family:Inter;font-weight:700;font-size:34px;color:#fff;letter-spacing:.02em;flex:1}
.card .p{font-family:Inter;font-weight:600;font-size:34px;color:rgba(255,255,255,.85);font-variant-numeric:tabular-nums;min-width:150px;text-align:right}
.tag{font-family:Inter;font-weight:800;font-size:20px;letter-spacing:.24em;background:var(--pill);color:#0B0F17;border-radius:40px;padding:10px 16px 10px 20px}
.ico{width:40px;height:40px;flex:none}
.barlbl{position:absolute;left:130px;width:820px;display:flex;justify-content:space-between;align-items:baseline}
.barlbl .k{font-family:Inter;font-weight:700;font-size:30px;letter-spacing:.2em;color:#fff}
.barlbl .arrow{font-family:Serif;font-style:italic;font-size:64px;color:var(--cream);line-height:1}
.track{position:absolute;left:130px;width:820px;height:34px;border-radius:34px;background:rgba(255,255,255,.1);overflow:hidden}
.track i{display:block;height:100%;border-radius:34px}
.q{font-family:Serif;font-style:italic;color:#fff;text-align:center;position:absolute;left:0;right:0}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <filter id="mb" x="-50%" y="-10%" width="200%" height="120%"><feGaussianBlur id="mbg" stdDeviation="0 0"/></filter>
</defs></svg>
<div id="root">
<div id="back">
  <div id="hookG"><div class="giant ghost" id="hg3">NÃO</div><div class="giant ghost" id="hg2">NÃO</div><div class="giant ghost" id="hg1">NÃO</div><div class="giant" id="hookNao">NÃO</div></div>
  <div class="giant" id="chega">chega.</div>
</div>
<div id="front">
<!-- Screen A: projects accepted at any price, then work vs revenue -->
<div id="gA" class="g"><div class="bg"></div>
  <div id="aK" class="kicker abs" style="top:500px;width:100%;text-align:center">pedidos recebidos</div>
  <div id="aCards"></div>
  <div id="aBars">
    <div class="barlbl" id="b1l" style="top:640px"><span class="k">HORAS DE TRABALHO</span><span class="arrow">↑</span></div>
    <div class="track" id="b1t" style="top:710px"><i id="b1" style="background:#fff;width:30%"></i></div>
    <div class="barlbl" id="b2l" style="top:840px"><span class="k">FATURAÇÃO</span><span class="arrow" style="color:var(--amber)">↓</span></div>
    <div class="track" id="b2t" style="top:910px"><i id="b2" style="background:var(--amber);width:70%"></i></div>
    <div id="b2v" class="abs" style="top:968px;left:130px;width:820px;text-align:right;font-family:Serif;font-style:italic;font-size:64px;color:var(--amber)"></div>
  </div>
</div>
<!-- scattered NÃO around my head -->
<div id="naos"></div>
<!-- Screen C: the quote -->
<div id="gC" class="g"><div class="bg"></div>
  <div id="cK" class="kicker abs" style="top:520px;width:100%;text-align:center">a frase</div>
  <div id="cMark" class="q" style="top:560px;font-size:260px;line-height:1;color:var(--cream);opacity:.9">“</div>
  <div id="cQ" class="q" style="top:800px;font-size:108px;line-height:1.06"></div>
  <div id="cUl" class="abs" style="height:4px;background:var(--amber);border-radius:4px;width:0"></div>
</div>
<svg id="bm" class="abs" style="left:508px;top:1104px;width:64px;height:78px;opacity:0" viewBox="0 0 24 30">
  <path id="bmp" d="M3 3.5A2.5 2.5 0 0 1 5.5 1h13A2.5 2.5 0 0 1 21 3.5V28l-9-6.2L3 28z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/>
</svg>
<div id="cap"></div>
</div>
</div>
<script>
const clamp=x=>Math.max(0,Math.min(1,x));
const eo=x=>{x=clamp(x);return 1-Math.pow(1-x,3)};
const eo5=x=>{x=clamp(x);return 1-Math.pow(1-x,5)};
const eio=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const p=(t,t0,d)=>eo((t-t0)/d);
const $=id=>document.getElementById(id);
function reveal(el,k,dy=16,blur=8){el.style.opacity=k;el.style.transform=`translateY(${(1-k)*dy}px)`;el.style.filter=k<1&&k>0?`blur(${(1-k)*blur}px)`:'none'}
function fadeScreen(el,t,tin,tout,d=0.28){const vis=t>tin-0.01&&t<tout+d+0.01;el.style.display=vis?'block':'none';if(vis)el.style.opacity=Math.min(p(t,tin,d),1-eio((t-tout)/d));return vis}
// landing shakes — same formula as comp_dji.py shake()
const SHAKES=[[0.46,16],[13.74,12]];
function shake(t){for(const [t0,a] of SHAKES){const u=t-t0;if(u>=0&&u<0.4){const e=Math.exp(-u/0.085);return [a*e*Math.sin(2*Math.PI*21*u),0.7*a*e*Math.sin(2*Math.PI*16*u+1.3),a*e]}}return [0,0,0]}
let CAPS=[];

// ---- chest captions
function buildCaps(){
  CAPS.forEach(c=>{
    const d=document.createElement('div');d.className='chunk';d.style.display='none';
    c.E=c.items.map(it=>{const s=document.createElement('span');s.className='it '+it.k+(it.acc?' acc':'')+(it.dim?' dim':'');
      s.textContent=it.k==='serif'?it.text:it.text.toUpperCase();d.appendChild(s);return s});
    $('cap').appendChild(d);c.el=d;
  });
}
function renderCaps(t){
  CAPS.forEach(c=>{
    const on=t>=c.start-0.08&&t<c.end;c.el.style.display=on?'block':'none';if(!on)return;
    const out=clamp((c.end-t)/0.09);c.el.style.opacity=out;c.el.style.filter=out<1?`blur(${(1-out)*6}px)`:'none';
    c.items.forEach((it,i)=>{const el=c.E[i];
      if(it.k==='big'){const k=p(t,it.t-0.06,0.3);reveal(el,k,22,10);el.style.letterSpacing=(-0.02+0.14*(1-eo5((t-it.t+0.06)/0.34)))+'em';
        let sc=0.94+0.06*k;if(it.pulse!==undefined){const u=(t-it.pulse)/0.38;if(u>0&&u<1)sc*=1+0.07*Math.sin(Math.PI*u)}
        el.style.transform+=` scale(${sc})`;}
      else if(it.k==='serif'){reveal(el,p(t,it.t-0.06,0.3),20,10)}
      else reveal(el,p(t,it.t-0.07,0.22),12,6);
    });
    if(c.bookmark!==undefined)renderBookmark(t,c.bookmark,c.end);
  });
}
function renderBookmark(t,t0,tend){
  const k=p(t,t0-0.05,0.25),o=Math.min(k,clamp((tend-t)/0.1));const bm=$('bm');bm.style.opacity=o;
  const u=(t-t0)/0.35;const s=0.6+0.4*k+(u>0&&u<1?0.18*Math.sin(Math.PI*u):0);bm.style.transform=`scale(${s})`;
  $('bmp').setAttribute('fill',t>t0+0.08?'#F2B24C':'none');$('bmp').setAttribute('stroke',t>t0+0.08?'#F2B24C':'#fff');
}

// ---- hook: giant NÃO dragged in from the right, behind me, lands with a shake
const HK={t0:0.04,land:0.46,out:2.02};
// rests 25 px left of centre so it stays inside the safe area (60..960) through the shake and the exit scale
function hookX(t){const u=clamp((t-HK.t0)/(HK.land-HK.t0));return -25+1150*(1-eo5(u))-26*Math.sin(Math.PI*clamp((t-HK.land)/0.22))}
function renderHook(t){
  const g=$('hookG');const vis=t>=HK.t0&&t<HK.out+0.3;g.style.display=vis?'block':'none';if(!vis)return 0;
  const x=hookX(t),v=Math.abs(x-hookX(t-1/60))*60;          // px/s
  const o=clamp((t-HK.t0)/0.06)*(1-eio((t-HK.out)/0.26));
  const n=$('hookNao');n.style.opacity=o;const sc=1+0.05*eio((t-HK.out)/0.26);
  n.style.transform=`translateX(${x}px) scale(${sc})`;
  $('mbg').setAttribute('stdDeviation',`${Math.min(v/140,38)} 0`);n.style.filter=v>30?'url(#mb)':(t>HK.out?`blur(${8*eio((t-HK.out)/0.26)}px)`:'none');
  ['hg1','hg2','hg3'].forEach((id,i)=>{const gx=hookX(t-(i+1)*0.022);const e=$(id);
    e.style.transform=`translateX(${gx}px)`;e.style.opacity=v>30?o*0.26*(1-i/3)*clamp(v/900):0;e.style.color='var(--amber)';
    e.style.fontFamily='InterTight';e.style.fontWeight=900;e.style.fontSize='400px';e.style.top='500px';e.style.letterSpacing='-.035em';e.style.filter='blur(10px)'});
  return 1;
}
// ---- climax: "chega." slams in behind me
function renderChega(t){
  const e=$('chega');const t0=13.66,t1=14.26;const vis=t>=t0&&t<t1+0.2;e.style.display=vis?'block':'none';if(!vis)return 0;
  const k=eo5((t-t0)/0.1);const o=clamp((t-t0)/0.05)*(1-eio((t-t1)/0.2));
  e.style.opacity=o;e.style.transform=`scale(${1.45-0.45*k})`;e.style.filter=k<1?`blur(${(1-k)*14}px)`:(t>t1?`blur(${6*eio((t-t1)/0.2)}px)`:'none');
  return 1;
}
// ---- "mais vezes NÃO": scattered around my head (top space, key moment only)
const NAOS=[ // x,y centre (px), size, t=tight / s=serif, opacity, rotation, appear
  [270,560,128,'t',1.00,-7,15.56,true],[560,420,150,'t',0.92,0,15.62,false],[830,520,104,'s',0.85,6,15.70,false],
  [220,860,76,'s',0.60,4,15.78,false],[790,840,112,'t',0.95,-4,15.84,true],[420,300,70,'s',0.50,-3,15.92,false],[760,300,64,'t',0.45,5,15.98,false]];
const NAO_OUT=16.58;
function buildNaos(){NAOS.forEach(([x,y,s,f,o,r,t0,acc])=>{const d=document.createElement('div');d.className='nao '+f;
  d.textContent=f==='t'?'NÃO':'não';d.style.fontSize=s+'px';d.style.color=acc?'var(--amber)':'#fff';$('naos').appendChild(d)});}
function renderNaos(t){
  const vis=t>15.5&&t<NAO_OUT+0.3;$('naos').style.display=vis?'block':'none';if(!vis)return;
  [...$('naos').children].forEach((d,i)=>{const [x,y,s,f,o,r,t0]=NAOS[i];const k=eo5((t-t0)/0.22);
    const pop=1+0.18*Math.sin(Math.PI*clamp((t-t0)/0.26));const out=1-eio((t-NAO_OUT-i*0.02)/0.24);
    d.style.opacity=o*clamp((t-t0)/0.08)*out;const w=d.offsetWidth,h=d.offsetHeight;
    d.style.left=(x-w/2)+'px';d.style.top=(y-h/2)+'px';
    d.style.transform=`rotate(${r}deg) scale(${(0.6+0.4*k)*pop}) translateY(${-20*(1-out)}px)`;d.style.filter=k<1?`blur(${(1-k)*8}px)`:(out<1?`blur(${(1-out)*6}px)`:'none')});
}

// ---- Screen A (revenue now drops on "e ganhava" and stays readable ~1.2 s before leaving)
const A={in:4.92,out:9.56,cards:[5.10,5.36,5.62,5.88,6.14],p0:[1200,900,750,600,450],p1:[300,150,200,90,50]};
function buildA(){
  A.cards.forEach((t0,i)=>{const c=document.createElement('div');c.className='card';c.style.top=(560+i*110)+'px';
    c.innerHTML=`<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2.5"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7"/></svg><span class="t">NOVO PROJETO</span><span class="p"></span><span class="tag">ACEITE</span>`;
    $('aCards').appendChild(c);A['c'+i]=c;});
}
function renderA(t){
  if(!fadeScreen($('gA'),t,A.in,A.out))return;
  const cardsOut=eio((t-6.98)/0.26);
  reveal($('aK'),p(t,A.in+0.05,0.35)*(1-cardsOut),10,4);
  A.cards.forEach((t0,i)=>{const c=A['c'+i];reveal(c,p(t,t0,0.28)*(1-cardsOut),26,6);if(cardsOut>0)c.style.transform=`translateY(${-40*cardsOut}px)`;
    const tag=c.querySelector('.tag');const tk=p(t,t0+0.12,0.2);tag.style.opacity=tk;tag.style.transform=`scale(${0.7+0.3*tk})`;
    const f=eio((t-6.30-i*0.05)/0.5);const v=Math.round(A.p0[i]+(A.p1[i]-A.p0[i])*f);
    const pe=c.querySelector('.p');pe.textContent=v.toLocaleString('pt-PT')+'€';pe.style.color=f>0?`rgba(255,255,255,${0.85-0.35*f})`:'';});
  ['b1l','b1t','b2l','b2t'].forEach((id,i)=>reveal($(id),p(t,7.10+i*0.05,0.28),20,5));
  $('b1').style.width=(30+66*eio((t-7.40)/0.45))+'%';
  const r=eio((t-7.92)/0.45);$('b2').style.width=(70-52*r)+'%';
  const bv=$('b2v');bv.textContent='−'+Math.round(74*r)+'%';reveal(bv,p(t,8.02,0.3),12,6);
}
// ---- Screen C (quote)
const C={in:21.52,out:24.30,lines:[[21.68,'Cada <span class="acc2">sim</span>'],[22.16,'a algo mau'],[22.88,'é um <span class="acc2">não</span>'],[23.60,'a algo <span id="best">melhor.</span>']]};
function buildC(){C.L=C.lines.map(([t0,h])=>{const d=document.createElement('div');d.innerHTML=h;$('cQ').appendChild(d);return [t0,d]});
  const st=document.createElement('style');st.textContent='.acc2{color:#F2B24C}';document.head.appendChild(st);}
function renderC(t){
  if(!fadeScreen($('gC'),t,C.in,C.out))return;
  reveal($('cK'),p(t,C.in+0.05,0.3),8,3);$('cK').style.top='520px';
  reveal($('cMark'),p(t,C.in+0.08,0.4),20,8);$('cMark').style.top='560px';
  C.L.forEach(([t0,d],i)=>{reveal(d,p(t,t0-0.06,0.3),18,9);if(i==1)d.style.color='rgba(255,255,255,.55)';});
  const b=$('best');if(b){const r=b.getBoundingClientRect();const ul=$('cUl');ul.style.left=r.left+'px';ul.style.top=(r.bottom-10)+'px';ul.style.width=(r.width*eio((t-23.94)/0.35))+'px';}
}
window.setup=(caps)=>{CAPS=caps;buildCaps();buildA();buildNaos();buildC();};
// returns true when the requested layer has something on it
window.render=(t,layer)=>{
  document.body.className=layer;
  const [dx,dy]=shake(t);$('root').style.transform=`translate(${dx}px,${dy}px)`;
  if(layer==='back'){return renderHook(t)+renderChega(t)>0}
  renderA(t);renderNaos(t);renderC(t);renderCaps(t);
  if(!CAPS.some(c=>c.bookmark!==undefined&&t>=c.start-0.08&&t<c.end))$('bm').style.opacity=0;
  return true;
};
</script>
</body></html>
